name: Python CI
on:
  push:
    branches: [main]
    tags: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Run tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      PULUMI_BACKEND_URL: file://~
      PULUMI_CONFIG_PASSPHRASE: test
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            python/pyproject.toml
            python/tests/infra/requirements.txt
      # Match the virtualenv declared in python/tests/infra/Pulumi.yaml.
      - name: Create test environment
        run: |
          python -m venv python/tests/infra/venv
          echo "$GITHUB_WORKSPACE/python/tests/infra/venv/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt build
          python -m pip check
      - name: Check formatting with Ruff
        run: ruff format --check .
      - name: Lint with Ruff
        run: ruff check .
      - name: Build package
        run: python -m build --outdir "$RUNNER_TEMP/dist" python
      # Configure this repository secret with a LocalStack CI auth token.
      - name: Set up LocalStack
        uses: LocalStack/setup-localstack@v0.3.2
        with:
          image-tag: "latest"
          install-awslocal: "false"
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      - name: Set up Pulumi
        uses: pulumi/actions@v7
      - name: Test with pytest
        run: python -m pytest
  publish:
    name: Build and publish package
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/python/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install dependencies
        run: python -m pip install --upgrade build
      - name: Build package
        run: python -m build
        working-directory: python
      # Configure PyPI trusted publishing for this repository and workflow.
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
